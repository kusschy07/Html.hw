<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <form action="Register">
        <!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

    <h1>Student Registration Form</h1>

    <form>

        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password"><br><br>

        <h3>Gender</h3>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label><br>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label><br>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label><br><br>

        <h3>Interests</h3>
        <input type="checkbox" id="programming" name="interest" value="Programming">
        <label for="programming">Programming</label><br>

        <input type="checkbox" id="webdev" name="interest" value="Web Development">
        <label for="webdev">Web Development</label><br>

        <input type="checkbox" id="gaming" name="interest" value="Gaming">
        <label for="gaming">Gaming</label><br><br>

        <label for="department">Department:</label><br>
        <select id="department" name="department">
            <option value="">Select Department</option>
            <option value="software-engineering">Software Engineering</option>
            <option value="computer-science">Computer Science</option>
            <option value="information-technology">Information Technology</option>
            <option value="data-science">Data Science</option>
        </select><br><br>

        <label for="about">About You:</label><br>
        <textarea id="about" name="about" rows="5" cols="40"></textarea><br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
    </form>
</body>
</html>
